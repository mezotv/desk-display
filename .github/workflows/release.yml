name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install production build dependencies
        run: npm ci --ignore-scripts

      - name: Build the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          DESK_DISPLAY_VERSION="$version" npm run build
          ./scripts/package-release.sh "$version"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/desk-display-*.tar.gz \
            dist/release/desk-display-release.json \
            --generate-notes \
            --latest \
            --title "Desk Display $GITHUB_REF_NAME" \
            --verify-tag
